<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>كشوفات عملاء جدار الساطع</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Sans+Arabic:wght@500;600&display=swap"><style>
/* Layout: a ledger on the phone - totals first, then one searchable list of customer accounts; tap a row to open its aging and download its statement */
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#14203d; --muted:#5d6883; --line:#dde3ef;
  --navy:#0b3d91; --gold:#e8b923; --red:#b42318; --red-bg:#fdecea; --green:#1d7a3e; --green-bg:#e7f5ec;
  --chip:#e9eef8;
  --f-display:'Tajawal','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'Tajawal','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-num:'IBM Plex Sans Arabic','Tajawal',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1222; --card:#141c31; --ink:#e7ecf7; --muted:#9aa6c3; --line:#26314d;
  --navy:#7ea6f2; --gold:#e8b923; --red:#ff8a7a; --red-bg:#3a1a1a; --green:#6fd394; --green-bg:#14301f; --chip:#1d2843; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1222; --card:#141c31; --ink:#e7ecf7; --muted:#9aa6c3; --line:#26314d;
  --navy:#7ea6f2; --gold:#e8b923; --red:#ff8a7a; --red-bg:#3a1a1a; --green:#6fd394; --green-bg:#14301f; --chip:#1d2843; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-direction:column;gap:2px;border-bottom:3px solid var(--gold);padding-bottom:10px}
header h1{font-family:var(--f-display);font-weight:800;font-size:1.45rem;margin:0;color:var(--navy);text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:.85rem}
.tot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile span{font-size:.75rem;color:var(--muted)}
.tile b{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:1.05rem;direction:ltr;text-align:right;overflow-wrap:anywhere}
.tile.red b{color:var(--red)}
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-direction:column;gap:8px;padding-block:6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#q{width:100%;font:inherit;font-size:16px;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
#q:focus,button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chips button{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--navy);color:var(--card);border-color:var(--navy)}
.chips .count{margin-inline-start:auto;color:var(--muted);font-size:.8rem}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
li{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
li.od{border-inline-start:4px solid var(--red)}
.row{width:100%;font:inherit;color:inherit;background:none;border:0;text-align:right;padding:10px 12px;display:grid;
  grid-template-columns:minmax(0,1fr) max-content;gap:2px 12px;cursor:pointer}
.nm{font-weight:700;font-size:.98rem;min-width:0;overflow-wrap:anywhere}
.ac{color:var(--muted);font-size:.75rem;font-family:var(--f-num);unicode-bidi:plaintext;text-align:right;white-space:nowrap}
.bal{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600;unicode-bidi:plaintext;text-align:left;white-space:nowrap;grid-row:1;grid-column:2}
.nm{grid-row:1;grid-column:1}.ac{grid-row:2;grid-column:1}
.st{grid-column:2;text-align:left;font-size:.75rem}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-weight:700;font-variant-numeric:tabular-nums}
.pill.r{background:var(--red-bg);color:var(--red)}
.pill.g{background:var(--green-bg);color:var(--green)}
.pill.c{background:var(--chip);color:var(--navy)}
.det{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.ag{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ag div{background:var(--chip);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:1px}
.ag span{font-size:.7rem;color:var(--muted)}
.ag b{font-family:var(--f-num);font-variant-numeric:tabular-nums;direction:ltr;text-align:right;font-size:.9rem}
.ag div.hot b{color:var(--red)}
.flow{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.dl{font:inherit;font-weight:700;font-size:1rem;background:var(--navy);color:var(--card);border:0;border-radius:10px;padding:12px;cursor:pointer}
.dl[disabled]{opacity:.6;cursor:default}
.msg{font-size:.8rem;color:var(--muted);min-height:1em}
.empty{color:var(--muted);text-align:center;padding:24px}
footer{color:var(--muted);font-size:.75rem;text-align:center;line-height:1.6}
@media (max-width:420px){.tot{grid-template-columns:1fr 1fr}.tot .tile:first-child{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style><style>
#lock{max-width:420px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
#lock h1{margin:0;color:var(--navy);font-size:1.3rem}
#lock p{margin:0;color:var(--muted);font-size:.9rem}
#pw{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);direction:ltr;text-align:center;letter-spacing:.1em}
#go{font:inherit;font-weight:700;font-size:1rem;background:var(--navy);color:var(--card);border:0;border-radius:10px;padding:12px;cursor:pointer}
#err{color:var(--red);font-size:.85rem;min-height:1em}
label.rm{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
</style></head><body>
<form id="lock" autocomplete="off">
  <h1>كشوفات حساب العملاء</h1>
  <p>شركة جدار الساطع التجارية — أدخل رمز الدخول</p>
  <input id="pw" type="password" inputmode="text" placeholder="رمز الدخول" autofocus>
  <label class="rm"><input id="rm" type="checkbox" checked> تذكّر الرمز على هذا الجوال</label>
  <button id="go" type="submit">دخول</button>
  <div id="err"></div>
</form>
<div class="wrap" id="app" hidden>
  <header>
    <h1>كشوفات حساب العملاء</h1>
    <p id="sub"></p>
  </header>
  <section class="tot" aria-label="الإجماليات">
    <div class="tile"><span>إجمالي أرصدة العملاء</span><b id="tb"></b></div>
    <div class="tile red"><span id="tol"></span><b id="to"></b></div>
    <div class="tile red"><span>عملاء عليهم متأخر</span><b id="nod"></b></div>
  </section>
  <div class="tools">
    <input id="q" type="search" placeholder="ابحث باسم العميل أو رقم الحساب" autocomplete="off">
    <div class="chips" role="group" aria-label="تصفية">
      <button data-f="od" aria-pressed="true">المتأخرين</button>
      <button data-f="all" aria-pressed="false">كل الأرصدة</button>
      <button data-f="cr" aria-pressed="false">دائن (دفعة مقدمة)</button>
      <span class="count" id="count"></span>
    </div>
  </div>
  <ul id="list"></ul>
  <footer id="foot"></footer>
</div>
<script>
const SALT="e61e490e27a044bb38ddf278fe9de79a", ITER=250000;
const hex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
let KEY=null, D=null, filter="od", q="", open=null;
async function derive(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:hex(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
}
async function dec(url){
  const b=new Uint8Array(await (await fetch(url,{cache:"no-cache"})).arrayBuffer());
  return crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(0,12)},KEY,b.slice(12));
}
async function unlock(pw,remember){
  KEY=await derive(pw);
  D=JSON.parse(new TextDecoder().decode(await dec("d/data.bin")));
  try{ if(remember) localStorage.setItem("jpw",pw); else localStorage.removeItem("jpw"); }catch(e){}
  document.getElementById("lock").hidden=true; document.getElementById("app").hidden=false;
  const f=n=>n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  document.getElementById("sub").textContent=`شركة جدار الساطع التجارية • حتى تاريخ ${D.asof} • آجل ${D.terms} يوماً • آخر 3 شهور`;
  document.getElementById("tb").textContent="SAR "+f(D.tb); document.getElementById("to").textContent="SAR "+f(D.to);
  document.getElementById("tol").textContent=`إجمالي المتأخر (+${D.terms} يوم)`; document.getElementById("nod").textContent=D.nod;
  document.getElementById("foot").textContent=`${D.rows.length} عميل عليهم رصيد من أصل ${D.nall} • اضغط على العميل ثم «تحميل كشف الحساب»`;
  render();
}
document.getElementById("lock").addEventListener("submit",async e=>{
  e.preventDefault(); const err=document.getElementById("err"); err.textContent="جاري الفتح…";
  try{ await unlock(document.getElementById("pw").value.trim(),document.getElementById("rm").checked); err.textContent=""; }
  catch(x){ err.textContent="الرمز غير صحيح."; KEY=null; }
});
(async()=>{ let pw=null; try{pw=localStorage.getItem("jpw");}catch(e){} if(pw){ try{ await unlock(pw,true);}catch(e){ try{localStorage.removeItem("jpw");}catch(_){}} } })();
const fmt=n=>(Math.abs(n)<0.005?"0.00":n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}));
const AG=["غير مستحق","متأخر 1–30","متأخر 31–60","متأخر 61–90","متأخر +90","رصيد سابق متأخر"];
function norm(s){return (s||"").replace(/[\u064B-\u065F\u0640]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").toLowerCase();}
function rows(){ const nq=norm(q);
  return D.rows.filter(r=>(filter==="od"?r.o>=1&&r.b>0:filter==="cr"?r.b<0:true))
    .filter(r=>!nq||norm(r.n).includes(nq)||r.no.includes(q.trim()))
    .sort((a,b)=>filter==="cr"?a.b-b.b:(b.o-a.o)||(b.b-a.b)); }
function render(){
  const list=document.getElementById("list"), rs=rows();
  document.getElementById("count").textContent=rs.length+" عميل"; list.replaceChildren();
  if(!rs.length){const e=document.createElement("li");e.className="empty";e.textContent="ما فيه عميل بهذا البحث";list.append(e);return;}
  for(const r of rs){
    const li=document.createElement("li"); if(r.o>=1&&r.b>0) li.className="od";
    const b=document.createElement("button"); b.className="row"; b.setAttribute("aria-expanded",open===r.no);
    const st=r.b<0?`<span class="pill c">دائن</span>`:r.o>=1?`<span class="pill r">متأخر ${fmt(r.o)}</span>`:`<span class="pill g">غير متأخر</span>`;
    b.innerHTML=`<span class="nm"></span><span class="bal">${fmt(r.b)}</span><span class="ac">${r.no}</span><span class="st">${st}</span>`;
    b.querySelector(".nm").textContent=r.n; b.onclick=()=>{open=open===r.no?null:r.no;render();}; li.append(b);
    if(open===r.no){
      const d=document.createElement("div"); d.className="det";
      const ag=AG.map((t,i)=>r.a[i]?`<div class="${i?"hot":""}"><span>${t}</span><b>${fmt(r.a[i])}</b></div>`:"").join("");
      d.innerHTML=`${ag?`<div class="ag">${ag}</div>`:""}<div class="flow">رصيد أول الفترة ${fmt(r.op)} • فواتير ${fmt(r.dr)} • مقبوضات ومرتجعات ${fmt(r.cr)} • الرصيد ${fmt(r.b)}</div>`;
      const btn=document.createElement("button"); btn.className="dl"; btn.textContent="تحميل كشف الحساب PDF";
      const msg=document.createElement("div"); msg.className="msg";
      btn.onclick=async()=>{ btn.disabled=true; msg.textContent="جاري التجهيز…";
        try{ const pdf=await dec("d/"+r.f+".bin"); const url=URL.createObjectURL(new Blob([pdf],{type:"application/pdf"}));
          const a=document.createElement("a"); a.href=url; a.download=`كشف حساب - ${r.n}.pdf`; document.body.append(a); a.click(); a.remove();
          setTimeout(()=>URL.revokeObjectURL(url),60000); msg.textContent="تم التحميل."; }
        catch(e){ msg.textContent="ما قدرت أفتح الملف، جرّب مرة ثانية."; } finally{ btn.disabled=false; } };
      d.append(btn,msg); li.append(d);
    }
    list.append(li);
  }
}
document.getElementById("q").addEventListener("input",e=>{q=e.target.value;render();});
document.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll(".chips button").forEach(x=>x.setAttribute("aria-pressed",x===b));render();});
</script></body></html>
