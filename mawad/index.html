<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b3d91">
<title>نواقص المستودع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b3d91;--navy2:#082d6b;--gold:#e8b923;--bg:#f2f5fb;--card:#fff;--fg:#14213d;--mut:#5d6b86;--line:#dfe5f0;--ok:#1f9d55;--bad:#d64545;--chip:#eef2fb;--sel:#fff6d6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1324;--card:#121c33;--fg:#eef2fb;--mut:#9aa7c2;--line:#22304f;--chip:#1a2644;--sel:#2a2a14;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Tajawal,"Segoe UI",Tahoma,sans-serif;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:calc(16px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 18px max(16px,env(safe-area-inset-left));border-bottom:4px solid var(--gold)}
header h1{margin:0;font-size:24px;font-weight:800}
.route{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:14px}
.route b{background:rgba(255,255,255,.14);padding:3px 10px;border-radius:20px}
.route .arr{color:var(--gold);font-weight:800}
.when{margin-top:4px;font-size:13px;opacity:.9}
main{max-width:none;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
#login,#manual,.narrow{max-width:640px;width:100%;margin-inline:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:17px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
label{font-size:14px;color:var(--mut);font-weight:700;display:block;margin-bottom:5px}
input,textarea,select{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;outline:none}
input:focus,select:focus{border-color:var(--navy)}
.btn{border:0;border-radius:14px;padding:13px;font:inherit;font-size:17px;font-weight:800;background:var(--gold);color:#1a1300;width:100%}
.btn.sec{background:var(--navy);color:#fff}.btn:disabled{opacity:.55}
.msg{border-radius:12px;padding:10px 12px;font-weight:700;font-size:15px}
.msg.ok{background:rgba(31,157,85,.12);color:var(--ok)}.msg.bad{background:rgba(214,69,69,.12);color:var(--bad)}
.badge{font-size:13px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--chip);color:var(--mut);white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mut);margin-left:6px}.dot.on{background:var(--ok)}.dot.off{background:var(--bad)}
.code{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
/* catalogue */
.tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 6px;margin:-8px 0 -6px;display:flex;flex-direction:column;gap:8px}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:22px;padding:8px 14px;font:inherit;font-size:15px;font-weight:700;white-space:nowrap}
.cat[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.cat small{opacity:.7;font-weight:500;margin-right:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:18px;padding:16px 12px;font:inherit;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:118px;justify-content:center}
.tile:active{background:var(--chip)}
.tile .ic{font-size:34px;line-height:1}
.tile .tn{font-weight:800;font-size:16px;text-wrap:balance}
.tile .tc{font-size:13px;color:var(--mut)}
.tile .sel{font-size:12px;font-weight:800;color:#1a1300;background:var(--gold);border-radius:12px;padding:1px 8px}
.crumb{display:flex;align-items:center;gap:10px}
.crumb button{border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:8px 12px;font:inherit;font-weight:800;white-space:nowrap}
.crumb b{font-size:18px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px}
.items>.empty,.items>.sep{grid-column:1/-1}
.sep{font-weight:800;font-size:15px;padding:8px 12px;border-radius:12px;margin-top:4px}
.sep.ok{background:rgba(31,157,85,.12);color:var(--ok)}
.sep.no{background:rgba(214,69,69,.10);color:var(--bad);margin-top:12px}
.row.out{opacity:.72}
.row{display:flex;flex-direction:column;gap:6px;justify-content:space-between;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:9px;min-height:158px;min-width:0}
.row.on{background:var(--sel);border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.pic{aspect-ratio:1/1;width:100%;border-radius:10px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:44px;color:var(--mut)}
.pic img{width:100%;height:100%;object-fit:contain;display:block}
.tile .timg{width:64px;height:64px;border-radius:14px;background:#fff;border:1px solid var(--line);object-fit:contain}
.row .nm{font-weight:800;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.row .sub{font-size:12px;color:var(--mut);display:flex;flex-wrap:wrap;gap:1px 8px;margin-top:3px}
.row .sub .z{color:var(--bad)}
.ctl{display:flex;flex-direction:column;gap:5px}
.step{display:flex;align-items:stretch;gap:4px}
.step button{width:38px;flex:none;border-radius:10px;border:1.5px solid var(--line);background:var(--chip);color:var(--fg);font-size:22px;font-weight:800;padding:0;line-height:1;min-height:38px}
.step input{text-align:center;font-weight:800;font-size:17px;padding:5px 2px;min-width:0;flex:1}
.ctl select{padding:4px 8px;font-size:13px;border-radius:10px}
.ctl select.one{appearance:none;-webkit-appearance:none;text-align:center;font-weight:800;opacity:1;color:var(--fg);background:var(--chip);border-color:transparent}
.eq{font-size:12px;font-weight:700;color:var(--mut);text-align:center}
.warn{font-size:12px;font-weight:700;color:var(--bad);line-height:1.3}
.more{text-align:center;color:var(--mut);font-size:14px;padding:6px}
details.card summary{font-weight:800;cursor:pointer;list-style:none}
details.card summary::-webkit-details-marker{display:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2>*{min-width:0}
/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.it{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.it .main{flex:1;min-width:0}.it .name{font-weight:800;overflow-wrap:anywhere}.it .sub{font-size:13px;color:var(--mut)}
.it .q{font-weight:800;white-space:nowrap;background:var(--chip);border-radius:10px;padding:4px 10px}
.it .del{border:0;background:none;color:var(--bad);font-size:20px;padding:6px}
.empty{color:var(--mut);text-align:center;padding:10px;font-size:15px}
/* bottom bar */
.bar{position:fixed;inset:auto 0 0 0;z-index:9;background:var(--card);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));box-shadow:0 -6px 20px rgba(11,61,145,.08)}
.bar .in{max-width:none;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar .sum{flex:1;min-width:0;font-weight:700;font-size:15px}
.bar .btn{width:auto;padding:12px 20px}
.bar .clr{background:none;border:0;color:var(--bad);font:inherit;font-weight:700}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>📦 نواقص المستودع</h1>
  <div class="route"><b>مستودع الخالدية</b><span class="arr">←</span><b>المخزن الرئيسي</b></div>
  <div class="when">اختر الأصناف الناقصة وحدد الكمية • سند يسوّي التحويل الساعة <b>1:00 الفجر</b></div>
</header>
<main>
  <section class="card" id="login">
    <h2>الدخول</h2>
    <div><label for="worker">اسمك</label><input id="worker" autocomplete="name" placeholder="مثال: محمد"></div>
    <div><label for="pin">الرمز</label><input id="pin" inputmode="numeric" type="password" placeholder="••••"></div>
    <button class="btn sec" id="enter">دخول</button>
    <div class="msg bad" id="loginMsg" hidden></div>
  </section>

  <section id="shop" hidden style="display:flex;flex-direction:column;gap:12px">
    <div class="tools">
      <div style="display:flex;gap:8px;align-items:center">
        <input id="q" type="search" placeholder="🔍 ابحث باسم الصنف أو رقمه" autocomplete="off">
        <span class="badge"><span class="dot" id="dot"></span><span id="conn">…</span></span>
      </div>
      <div class="crumb" id="crumb" hidden><button type="button" id="back">‹ الأقسام</button><b id="curName"></b></div>
    </div>
    <div class="msg" id="sendMsg" hidden></div>
    <div class="tiles" id="tiles"></div>
    <div class="items" id="items"></div>
    <div class="more" id="more" hidden></div>

    <details class="card" id="manual">
      <summary>➕ صنف مو موجود في القائمة؟ اكتبه يدوي</summary>
      <div><label for="mItem">اسم الصنف</label><input id="mItem" placeholder="اكتب الاسم كما تعرفه"></div>
      <div class="grid2">
        <div><label for="mQty">الكمية</label><input id="mQty" inputmode="decimal" value="1"></div>
        <div><label for="mUnit">الوحدة</label><select id="mUnit"></select></div>
      </div>
      <div><label for="mNote">ملاحظة (اختياري)</label><input id="mNote"></div>
      <button class="btn sec" id="mAdd">أضف للسلة</button>
    </details>

    <section class="card narrow">
      <h2>بانتظار تحويل الليلة <span class="badge" id="count">0</span></h2>
      <div class="list" id="pending"></div>
    </section>
    <section class="card narrow">
      <h2>آخر ما تحوّل <span class="badge" id="lastRun" hidden></span></h2>
      <div class="list" id="done"></div>
    </section>
  </section>
</main>

<div class="bar" id="bar" hidden>
  <div class="in">
    <div class="sum" id="sum"></div>
    <button class="clr" id="clear">مسح</button>
    <button class="btn" id="send">إرسال للتحويل</button>
  </div>
</div>

<script>
const UNITS=["حبه","كرتون","درزن","باكت","طقم","كيس","علبه","ربطه","سطل","لفة","متر","برميل"];
const CATS=[["🖌️ فرش","فرشة فرشه فرشاة فرش"],["🪶 ريش","ريشة ريشه"],["🧻 رولات وعصي","رول رولة قلب عصاء عصا"],
 ["🎨 دهانات وبويات","بوية بويه دهان تلوينة تلوينه تنر بخاخ ورنيش اساس برايمر"],["🧴 غراء وسليكون ومعجون","غراء سليكون سيليكون معجون فوم لاصق"],
 ["🪨 صنفرة وأحجار وديسك","صنفرة صنفره ورق حجر دسك ديسك"],["📏 تيبات وأشرطة","تيب شريط"],["🔪 سكاكين ومقصات","سكين مقص قطاعه قطاعة كتر"],
 ["🔧 عدد يدوية","مفتاح مفك زرادية شاكوش مطرقة منشار ازميل مبرد بروة دفاش لي طقم قفيز مسدس كريك عتلات"],
 ["📐 قياس وموازين","ميزان متر زاوية زوايا قلم مسطرة"],["⚡ كهربائية وكيابل","دريل هلتي خلاط كيبل غيار فيش افياش توصيلة كاوية جهاز صاروخ"],
 ["🔩 مسامير وتثبيت","مسامير مسمار هولسو برغي براغي فيشر خابور اسياخ كليبس فواصل"],["🔒 أقفال ومفصلات","كيلون قفل مفصلات مفصلة سوستة هندل مسكة ايادي سلاسل حبل خيط"],
 ["🧤 سلامة","كفوف كف قفاز نظارة كمام خوذة"],["🏠 منزلية","صحن قدر ملاعق ملعقة ثلاجة غسالة لحاف مراتب مرتبة حافظة كرسي مكانس مكنسة صانعة حاوية حوض شنطة سطل جردل غلاية بطانية شرشف فرامة صفاية طاولة"]];
const $=id=>document.getElementById(id);
const store={get(k,d=""){try{return localStorage.getItem("mawad_"+k)??d}catch(e){return d}},set(k,v){try{localStorage.setItem("mawad_"+k,v)}catch(e){}}};
const nz=t=>(t||"").toLowerCase().replace(/[إأآا]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/ـ/g,"");
let API="",PIN=store.get("pin"),CAT=[],cur="",CART={},HASIMG=false;
const EMO=[["فرش","🖌️"],["ريش","🪶"],["رول","🧻"],["دهان","🎨"],["بوي","🎨"],["صنفر","🪨"],["تيب","📏"],["شريط","📏"],["لاصق","🧴"],["سليكون","🧴"],["غراء","🧴"],["معجون","🧴"],["عدد","🔧"],["ادوات","🔧"],["أدوات","🔧"],["كهرب","⚡"],["مسامير","🔩"],["براغي","🔩"],["اقفال","🔒"],["أقفال","🔒"],["سلام","🧤"],["قياس","📐"],["سباك","🚿"],["نظاف","🧹"],["منزل","🏠"],["سكاكين","🔪"]];
function secIcon(n){const m=n.match(/^(\p{Extended_Pictographic}\uFE0F?)\s*(.*)$/u);if(m)return [m[1],m[2]];for(const [k,e] of EMO)if(n.includes(k))return [e,n];return ["📦",n]}
try{CART=JSON.parse(store.get("cart","{}"))||{}}catch(e){CART={}}
$("worker").value=store.get("worker");$("pin").value=PIN;
UNITS.forEach(u=>$("mUnit").add(new Option(u,u)));

// Sanad's PC address changes when it restarts. The page copy (api.json) can lag ~2 min behind, so also ask GitHub directly.
async function alive(u){try{const c=new AbortController();setTimeout(()=>c.abort(),6000);const r=await fetch(u+"/wh/api/ping",{signal:c.signal,cache:"no-store"});return r.ok}catch(e){return false}}
async function findApi(){
  const tryGet=async f=>{try{const u=(await f()).replace(/\/$/,"");if(u&&await alive(u))return u}catch(e){}return ""};
  let u=await tryGet(async()=>(await (await fetch("api.json?t="+Date.now(),{cache:"no-store"})).json()).api);
  if(!u)u=await tryGet(async()=>{const j=await (await fetch("https://api.github.com/repos/abdulhafedhhamood/jidar-kashf/contents/mawad/api.json?t="+Date.now(),{cache:"no-store"})).json();
    return JSON.parse(atob(j.content.replace(/\s/g,""))).api});
  if(!u)throw new Error("offline");return u}
async function api(path,body){
  if(!API)API=await findApi();
  const r=await fetch(API+"/wh/api/"+path,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(Object.assign({pin:PIN},body||{}))});
  const j=await r.json().catch(()=>({ok:false}));if(r.status===403)throw new Error("pin");return j;
}
function conn(ok,t){$("dot").className="dot "+(ok?"on":"off");$("conn").textContent=t}
function catOf(name){const w=nz(name).match(/[؀-ۿ]+/g)||[];
  for(const [c,k] of CATS){const ks=nz(k).split(" ");if(w[0]&&ks.includes(w[0]))return c}
  for(const [c,k] of CATS){const ks=nz(k).split(" ");if(w.some(x=>ks.includes(x)))return c}
  return "📦 أخرى"}
function saveCart(){store.set("cart",JSON.stringify(CART));drawBar()}

async function loadCat(){
  try{const j=await api("items");CAT=(j.items||[]).map(i=>Object.assign(i,{k:nz(i.name+" "+i.code),c:(i.sec||"").trim()||catOf(i.name)}));HASIMG=CAT.some(i=>i.img);
    drawItems();}catch(e){}
}
function catNames(){const counts={};CAT.forEach(i=>counts[i.c]=(counts[i.c]||0)+1);
  const kw=[...CATS.map(c=>c[0]),"📦 أخرى"];const site=Object.keys(counts).filter(n=>!kw.includes(n)).sort((x,y)=>counts[y]-counts[x]);
  return [[...site,...kw.filter(n=>counts[n])],counts]}
function drawCats(){
  const [names,counts]=catNames();const inCart={};Object.values(CART).forEach(x=>{if(x.c)inCart[x.c]=(inCart[x.c]||0)+1});
  $("tiles").replaceChildren(...names.map(n=>{const b=document.createElement("button");b.type="button";b.className="tile";
    const [ic,nm]=secIcon(n);const smp=CAT.find(x=>x.c===n&&x.img);let i;
    if(smp){i=document.createElement("img");i.className="timg";i.loading="lazy";i.alt="";i.src=smp.img;i.onerror=()=>{const e=document.createElement("span");e.className="ic";e.textContent=ic;i.replaceWith(e)}}
    else{i=document.createElement("span");i.className="ic";i.textContent=ic}
    const t=document.createElement("span");t.className="tn";t.textContent=nm;
    const c=document.createElement("span");c.className="tc";c.textContent=counts[n]+" صنف";b.append(i,t,c);
    if(inCart[n]){const s=document.createElement("span");s.className="sel";s.textContent="✓ "+inCart[n]+" مختار";b.appendChild(s)}
    b.onclick=()=>{cur=n;$("q").value="";drawItems();scrollTo({top:0})};return b}));
}
function key(i){return i.code+"|"+i.unit}
function drawItems(){
  const q=nz($("q").value.trim());const browsing=!q&&!cur;
  $("tiles").hidden=!browsing;$("items").hidden=browsing;$("crumb").hidden=browsing||!!q;$("curName").textContent=cur?secIcon(cur).join(" "):"";
  if(browsing){drawCats();$("more").hidden=true;return}
  let list;if(q){const ws=q.split(/\s+/);list=CAT.filter(i=>ws.every(w=>i.k.includes(w)))}else list=CAT.filter(i=>i.c===cur);
  const has=i=>+i.qty>0;list=[...list.filter(has),...list.filter(i=>!has(i))];      // available in الخالدية first
  const shown=list.slice(0,300);const nAv=shown.filter(has).length;
  const sep=(t,cls)=>Object.assign(document.createElement("div"),{className:"sep "+cls,textContent:t});
  const els=[];if(shown.length){if(nAv)els.push(sep(`✓ متوفر في مستودع الخالدية (${list.filter(has).length})`,"ok"));
    shown.forEach((i,k)=>{if(k===nAv&&nAv<shown.length)els.push(sep(`✕ غير متوفر في مستودع الخالدية (${list.length-list.filter(has).length})`,"no"));els.push(rowEl(i))})}
  $("items").replaceChildren(...(shown.length?els:[Object.assign(document.createElement("div"),{className:"empty",textContent:CAT.length?"ما لقيت أصناف":"جاري تحميل الأصناف…"})]));
  $("more").hidden=list.length<=300;$("more").textContent=`يظهر 300 من ${list.length} - اكتب في البحث لتضييق النتائج`;
}
$("back").onclick=()=>{cur="";$("q").value="";drawItems();scrollTo({top:0})};
function rowEl(i){
  const k=key(i),c=CART[k];
  const r=document.createElement("div");r.className="row"+(c&&c.qty>0?" on":"")+(+i.qty>0?"":" out");
  const L=document.createElement("div");L.style.minWidth=0;
  const n=document.createElement("div");n.className="nm";n.textContent=i.name;n.title=i.name;
  const s=document.createElement("div");s.className="sub";
  const add=(t,cls)=>{const e=document.createElement("span");e.textContent=t;if(cls)e.className=cls;s.appendChild(e)};
  add("#"+i.code,"code");add(i.unit);
  const big=(i.units||[]).filter(u=>((i.packs||{})[u]||1)>1).pop(),bp=big?(i.packs[big]||1):1;
  const both=q=>(+q)+(big&&+q>=bp?` (${Math.floor(+q/bp)} ${big})`:"");
  if(i.qty!=null)add("الخالدية "+both(i.qty),+i.qty<=0?"z":"");if(i.main!=null)add("الرئيسي "+both(i.main),+i.main<=0?"z":"");
  if(HASIMG){const pc=document.createElement("div");pc.className="pic";
    if(i.img){const im=document.createElement("img");im.loading="lazy";im.alt="";im.src=i.img;im.onerror=()=>{pc.textContent=secIcon(i.c)[0]};pc.appendChild(im)}else pc.textContent=secIcon(i.c)[0];
    L.append(pc)}
  L.append(n,s);
  const C=document.createElement("div");C.className="ctl";
  const st=document.createElement("div");st.className="step";
  const minus=document.createElement("button");minus.type="button";minus.textContent="−";minus.setAttribute("aria-label","أقل");
  const inp=document.createElement("input");inp.inputMode="decimal";inp.value=c?c.qty:0;inp.setAttribute("aria-label","الكمية");
  const plus=document.createElement("button");plus.type="button";plus.textContent="+";plus.setAttribute("aria-label","أكثر");
  const sel=document.createElement("select");sel.setAttribute("aria-label","الوحدة");
  const us=(i.units&&i.units.length?i.units:[i.unit]).filter(Boolean);const pk=u=>+((i.packs||{})[u])||1;   // only the units DigitalPro has for this item
  us.forEach(u=>sel.add(new Option(pk(u)>1?`${u} (${pk(u)} ${i.unit})`:u,u)));
  sel.value=c&&us.includes(c.unit)?c.unit:us[0];if(us.length<2){sel.disabled=true;sel.classList.add("one")}
  if(!c){const pu=store.get("u_"+i.code);if(pu&&us.includes(pu))sel.value=pu}                      // remember the worker's usual unit
  const warn=document.createElement("div");warn.className="warn";warn.hidden=true;
  const eq=document.createElement("div");eq.className="eq";eq.hidden=true;
  const set=v=>{v=Math.max(0,Math.round((parseFloat(v)||0)*100)/100);inp.value=v;
    if(v>0)CART[k]={code:i.code,item:i.name,qty:v,unit:sel.value,c:i.c};else delete CART[k];r.classList.toggle("on",v>0);
    const p=pk(sel.value),av=Math.floor((+i.qty||0)/p);warn.hidden=!(v>0&&i.qty!=null&&v>av);
    warn.textContent=av>0?`المتوفر ${av} ${sel.value} فقط - سند يحوّل المتوفر`:`غير متوفر بوحدة ${sel.value} في الخالدية`;
    eq.hidden=!(v>0&&p>1);eq.textContent=`= ${Math.round(v*p*100)/100} ${i.unit}`;saveCart()};
  minus.onclick=()=>set((parseFloat(inp.value)||0)-1);plus.onclick=()=>set((parseFloat(inp.value)||0)+1);
  inp.onchange=()=>set(inp.value);inp.onfocus=()=>inp.select();sel.onchange=()=>{store.set("u_"+i.code,sel.value);set(inp.value)};
  st.append(plus,inp,minus);C.append(st,sel,eq,warn);r.append(L,C);if(c&&c.qty>0)set(c.qty);return r;
}
function drawBar(){
  const v=Object.values(CART);$("bar").hidden=!v.length||$("shop").hidden;
  $("sum").textContent=v.length?`🧺 ${v.length} صنف في السلة`:"";
}
$("q").addEventListener("input",()=>{if(!$("q").value.trim()&&cur==="")drawItems();else drawItems()});
$("clear").onclick=()=>{CART={};saveCart();drawItems()};
$("mAdd").onclick=()=>{const it=$("mItem").value.trim(),q=parseFloat($("mQty").value);if(!it||!(q>0))return;
  CART["m|"+Date.now()]={code:"",item:it,qty:q,unit:$("mUnit").value,note:$("mNote").value.trim()};$("mItem").value=$("mNote").value="";$("mQty").value=1;saveCart()};
$("send").onclick=async()=>{
  const ents=Object.entries(CART);if(!ents.length)return;$("send").disabled=true;const m=$("sendMsg");m.hidden=false;m.className="msg";m.textContent="جاري الإرسال…";
  let ok=0,bad=0;
  for(const [k,x] of ents){try{const j=await api("add",{worker:store.get("worker"),code:x.code,item:x.item,qty:x.qty,unit:x.unit,note:x.note||""});if(j.ok){ok++;delete CART[k]}else bad++}catch(e){bad++;if(e.message==="pin"){logout("الرمز غلط");break}}}
  saveCart();drawItems();load();$("send").disabled=false;
  m.className="msg "+(bad?"bad":"ok");m.textContent=bad?`انرسل ${ok} وما انرسل ${bad} - جهاز سند غير متصل، اضغط إرسال مرة ثانية بعد دقيقة`:`✓ انرسل ${ok} صنف للتحويل الليلة`;
  setTimeout(()=>{if(!bad)m.hidden=true},5000);
};

function item(i,canDel){
  const d=document.createElement("div");d.className="it";const m=document.createElement("div");m.className="main";
  const n=document.createElement("div");n.className="name";n.textContent=(i.item||"صنف")+(i.code?"  #"+i.code:"");
  const s=document.createElement("div");s.className="sub";s.textContent=`${i.worker} • ${i.t.slice(5).replace("-","/")}`+(i.note?` • ${i.note}`:"")+(i.sent?` • تحوّل ${i.sent}`:"");
  m.append(n,s);const q=document.createElement("div");q.className="q";q.textContent=`${+i.qty} ${i.unit}`;d.append(m,q);
  if(canDel){const x=document.createElement("button");x.className="del";x.title="حذف";x.textContent="✕";x.onclick=async()=>{x.disabled=true;try{await api("del",{id:i.id});load()}catch(e){x.disabled=false}};d.appendChild(x)}
  return d}
const none=t=>Object.assign(document.createElement("div"),{className:"empty",textContent:t});
async function load(){
  try{const j=await api("list");conn(true,"متصل");
    $("count").textContent=j.pending.length;$("pending").replaceChildren(...(j.pending.length?j.pending.map(i=>item(i,true)):[none("ما فيه أصناف بعد اليوم")]));
    $("done").replaceChildren(...(j.done.length?j.done.slice(0,15).map(i=>item(i,false)):[none("لا شيء بعد")]));
    $("lastRun").hidden=!j.last_run;$("lastRun").textContent=j.last_run?("آخر تحويل "+j.last_run.slice(5)):"";return true;
  }catch(e){if(e.message==="pin"){logout("الرمز غلط");return false}API="";conn(false,"غير متصل");return false}
}
function show(){$("login").hidden=true;$("shop").hidden=false;drawBar();load().then(loadCat)}
function logout(m){$("shop").hidden=true;$("bar").hidden=true;$("login").hidden=false;$("loginMsg").hidden=!m;$("loginMsg").textContent=m||""}
$("enter").onclick=()=>{const w=$("worker").value.trim();PIN=$("pin").value.trim();
  if(!w||!PIN){$("loginMsg").hidden=false;$("loginMsg").textContent="اكتب اسمك والرمز";return}store.set("worker",w);store.set("pin",PIN);show()};
if(store.get("worker")&&PIN)show();
setInterval(()=>{if(!$("shop").hidden)load().then(ok=>{if(ok&&!CAT.length)loadCat()})},60000);
setInterval(()=>{if(!$("shop").hidden&&!API)load().then(ok=>{if(ok&&!CAT.length)loadCat()})},15000);
</script>
</body>
